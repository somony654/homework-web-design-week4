<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="part2.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <h2>Create Account</h2>
        </div>

        <form class="form-container">

            <div class="form-group">
                <label for="firstName">First name *</label>
                <input type="text" id="firstName"
                    placeholder="enter your first name" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName"
                    placeholder="enter your last name">
            </div>

            <div class="form-group full-width">
                <label for="email">Email *</label>
                <input type="email" id="email"
                    placeholder="enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password"
                    placeholder="enter your password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword"
                    placeholder="enter your password again" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="options">
                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Hobbies</label>
                <div class="options">
                    <label>
                        <input type="checkbox" name="hobbies" value="Music">
                        Music
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Sports">
                        Sports
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Travel">
                        Travel
                    </label>

                    <label>
                        <input type="checkbox" name="hobbies" value="Movies">
                        Movies
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="incomeSource">Source of Income</label>
                <select id="incomeSource">
                    <option>Employed</option>
                    <option>Self-employed</option>
                    <option>Unemployed</option>
                    <option>Student</option>
                </select>
            </div>

            <div class="form-group">
                <label for="income">Income</label>
                <div class="range-container">
                    <input type="range" id="income"
                        min="0" max="100000" value="20000"
                        step="1000">

                    <span id="incomeValue">20K</span>
                </div>
            </div>

            <div class="form-group">
                <label for="profile">Upload Profile Picture</label>
                <input type="file" id="profile" accept="image/*">
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" value="18" min="1">
            </div>

            <div class="form-group full-width">
                <label for="bio">Bio</label>
                <textarea id="bio" rows="5"></textarea>
            </div>

        </form>

        <div class="footer">
            <button type="button" onclick="alert('Account created!')">
                Create
            </button>
        </div>

    </div>

    <script>
        const income = document.getElementById("income");
        const incomeValue = document.getElementById("incomeValue");

        income.addEventListener("input", function() {
            incomeValue.textContent =
                (income.value / 1000) + "K";
        });
    </script>

</body>
</html>
