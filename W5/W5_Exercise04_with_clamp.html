<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise4 with clamp function</title>
    <style>
        body {
            margin: 0;
        }
        .wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .content {
            width: clamp(300px, 100%, 800px);
            height: 300px;
            background-color: green;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="content">
        </div>
    </div>

</body>
</html>
